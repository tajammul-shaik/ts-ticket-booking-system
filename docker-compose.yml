# The whole system on one machine (OPS-02, NFR-12): MySQL + the application.
#
#   docker compose up --build -d --wait        # clean clone: nothing else needed
#   ./burst.sh                                 # 20k-request burst at http://localhost:8080
#   docker compose down                        # keep data;  `down -v` wipes MySQL
#
# Every ${VAR:-default} can be set in a .env file next to this one (see .env.example) or in your
# shell. The defaults are local-only values, so a clean clone runs as-is.
# To see how it behaves on Render's free plan, uncomment `cpus: 0.1` and set
# ADMISSION_ACQUIRE_TIMEOUT=30s (CLAUDE.md lesson 24).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-ticketing}
      MYSQL_USER: ${DATABASE_USERNAME:-ticketing}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-ticketing}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"        # 3308 avoids clashing with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      # First boot on an empty volume can take minutes on slow disks (CLAUDE.md lesson 3).
      start_period: 300s
      start_interval: 5s

  app:
    build: .
    image: ts-ticketing/app:local
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DATABASE_NAME:-ticketing}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-ticketing}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ticketing}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      ADMIN_SECRET: ${ADMIN_SECRET:-local-admin-secret}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      ADMISSION_MAX_IN_FLIGHT: ${ADMISSION_MAX_IN_FLIGHT:-64}
      ADMISSION_ACQUIRE_TIMEOUT: ${ADMISSION_ACQUIRE_TIMEOUT:-5s}
      RATE_LIMIT_USER_RATE: ${RATE_LIMIT_USER_RATE:-20}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-40}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    mem_limit: 512m                 # Render free/starter size
    # cpus: 0.1                     # Render free CPU (startup then takes ~100 s)
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp is enough for a status-line check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s

volumes:
  mysql-data:
