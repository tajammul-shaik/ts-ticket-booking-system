# NFR-12 / OPS-02: `docker compose up` on a clean clone runs app + MySQL, no manual steps.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # 3307 avoids clashing with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uticketing", "-pticketing"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/ticketing
      DATABASE_USERNAME: ticketing
      DATABASE_PASSWORD: ticketing
      DB_POOL_SIZE: "10"
    ports:
      - "8080:8080"
    mem_limit: 512m
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp is enough for a status-line check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
